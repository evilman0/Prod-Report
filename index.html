<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Отчёт с производства</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121820;
      --card-bg: #1c2430;
      --input-bg: #263242;
      --accent-color: #ff9f0a; /* Индустриальный оранжевый */
      --accent-hover: #e08b07;
      --text-color: #f2f4f8;
      --text-secondary: #8e9bb0;
      --danger-color: #ff453a;
      --border-color: #2e3c4e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      padding-bottom: 90px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
    }

    .header h1 {
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-color);
    }

    .section-title {
      font-size: 14px;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 24px 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Карточка с динамической записью оборудования */
    .entry-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      position: relative;
    }

    .entry-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .entry-card-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--text-secondary);
    }

    .btn-remove {
      background: rgba(255, 69, 58, 0.15);
      color: var(--danger-color);
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-add {
      width: 100%;
      background: transparent;
      border: 2px dashed var(--border-color);
      color: var(--accent-color);
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-submit {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 159, 10, 0.3);
    }

    .btn-submit:disabled {
      background: #555;
      color: #888;
      box-shadow: none;
    }

    /* === СТИЛИ ДЛЯ СЕКРЕТНОГО ОКНА (ПАСХАЛКИ) === */
    .easter-egg-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    .easter-egg-modal.active {
      display: flex;
      animation: modalShake 0.4s ease-in-out;
    }

    .easter-egg-content {
      text-align: center;
      position: relative;
      max-width: 90%;
    }

    .easter-egg-img {
      max-width: 100%;
      max-height: 60vh;
      border-radius: 16px;
      border: 3px solid var(--accent-color);
      box-shadow: 0 0 30px var(--accent-color), 0 0 60px var(--accent-color);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), neonPulse 1.5s infinite alternate;
    }

    .easter-egg-title {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 900;
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-close-egg {
      margin-top: 20px;
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    /* Анимации */
    @keyframes popIn {
      0% { transform: scale(0) rotate(-10deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes neonPulse {
      0% { box-shadow: 0 0 20px var(--accent-color); }
      100% { box-shadow: 0 0 50px #ff3b30, 0 0 80px var(--accent-color); }
    }

    @keyframes modalShake {
      0%, 100% { transform: translate(0, 0); }
      20%, 60% { transform: translate(-10px, 0); }
      40%, 80% { transform: translate(10px, 0); }
    }
  </style>
</head>
<body>

  <div class="header">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color);"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <h1>Отчёт по смене Reborn</h1>
  </div>

  <form id="reportForm">
    <!-- Общие данные -->
    <div class="form-group">
      <label for="fullName">ФИО Оператора</label>
      <input type="text" id="fullName" placeholder="Дьяков А.А." required>
    </div>

    <div class="form-group">
      <label for="reportDate">Дата смены</label>
      <input type="date" id="reportDate" required>
    </div>

    <!-- Блок станков и деталей -->
    <div class="section-title">
      <span>Выработка по станкам</span>
    </div>

    <div id="entriesContainer"></div>

    <button type="button" class="btn-add" id="addEntryBtn">
      <span>+ Добавить станок / деталь</span>
    </button>

    <!-- Примечания -->
    <div class="form-group" style="margin-top: 20px;">
      <label for="notes">Примечания</label>
      <textarea id="notes" rows="3" placeholder="Почасовая работа, плановое ТО и т.д."></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Отправить отчёт</button>
  </form>

  <!-- Секретное всплывающее окно -->
  <div id="easterEggModal" class="easter-egg-modal">
    <div class="easter-egg-content">
      <img id="easterEggImg" class="easter-egg-img" src="secret.jpg" alt="Секрет">
      <div class="easter-egg-title">Титьки!</div>
      <button type="button" class="btn-close-egg" onclick="closeEasterEgg()">Закрыть</button>
    </div>
  </div>

  <script>
    // === НАСТРОЙКИ БОТА ===
    const BOT_TOKEN = "7665931565:AAF8fJiY25D04V4wX5_GH8-ZqB-qBzp2EEk";
    const CHAT_ID = "-1002607916886";

    // Безопасное получение объекта Telegram WebApp
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg && tg.expand) {
      tg.expand();
    }

    // Автоматическая установка текущей даты
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('reportDate').value = `${yyyy}-${mm}-${dd}`;

    // Подстановка имени из профиля Telegram
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const u = tg.initDataUnsafe.user;
      const name = `${u.first_name || ''} ${u.last_name || ''}`.trim();
      if (name) {
        document.getElementById('fullName').value = name;
      }
    }

    let entryCounter = 0;

    // Функция добавления новой карточки станка
    function addEntry() {
      entryCounter++;
      const container = document.getElementById('entriesContainer');
      if (!container) return;

      const card = document.createElement('div');
      card.className = 'entry-card';
      card.id = `entry-${entryCounter}`;
      
      card.innerHTML = `
        <div class="entry-card-header">
          <span class="entry-card-title">Позиция #${entryCounter}</span>
          ${entryCounter > 1 ? `<button type="button" class="btn-remove" onclick="removeEntry(${entryCounter})">Удалить</button>` : ''}
        </div>
        <div class="form-group">
          <label>Станок</label>
          <input type="text" class="input-machine" placeholder="Например: Sowin" required>
        </div>
        <div class="form-group">
          <label>Деталь</label>
          <input type="text" class="input-part" placeholder="Например: Винт Квадрат" required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Готово (шт)</label>
            <input type="number" class="input-qty" placeholder="0" min="0" required>
          </div>
          <div class="form-group">
            <label>Брак (шт)</label>
            <input type="number" class="input-defect" placeholder="0" min="0" value="0">
          </div>
        </div>
      `;
      container.appendChild(card);
    }

    function removeEntry(id) {
      const card = document.getElementById(`entry-${id}`);
      if (card) card.remove();
    }

    // Автоматически добавляем первую карточку
    addEntry();

    // Кнопка добавления
    document.getElementById('addEntryBtn').addEventListener('click', () => {
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
      addEntry();
    });

    // Функция открытия секретного окна
    function showEasterEgg() {
      const modal = document.getElementById('easterEggModal');
      if (modal) {
        modal.classList.add('active');
      }
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('error');
      }
    }

    // Функция закрытия секретного окна
    function closeEasterEgg() {
      const modal = document.getElementById('easterEggModal');
      if (modal) {
        modal.classList.remove('active');
      }
    }

    // Обработка отправки формы
    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fullNameInput = document.getElementById('fullName');
      const fullName = fullNameInput ? fullNameInput.value.trim() : "";

      // === ПРОВЕРКА СЕКРЕТНОГО СЛОВА ===
      const SECRET_WORD = "титьки";
    
      if (fullName.toLowerCase() === SECRET_WORD.toLowerCase()) {
        showEasterEgg();
        return; // Не отправляем сообщение в Telegram
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Отправка...";

      const reportDate = document.getElementById('reportDate').value;
      const notes = document.getElementById('notes').value;

      const cards = document.querySelectorAll('.entry-card');
      let itemsText = "";

      cards.forEach((card, index) => {
        const machine = card.querySelector('.input-machine').value;
        const part = card.querySelector('.input-part').value;
        const qty = card.querySelector('.input-qty').value;
        const defect = card.querySelector('.input-defect').value;

        itemsText += `\n<b>${index + 1}. ${machine}</b>\n` +
                     `└ Деталь: <code>${part}</code>\n` +
                     `└ Изготовлено: <b>${qty} шт.</b>\n` +
                     `└ Брак: <b>${defect} шт.</b>\n`;
      });

      const message = `🏭 <b>ОТЧЁТ С ПРОИЗВОДСТВА</b>\n\n` +
                      `👤 <b>Сотрудник:</b> ${fullName}\n` +
                      `📅 <b>Дата:</b> ${reportDate}\n` +
                      `───────────────` +
                      `${itemsText}` +
                      `───────────────\n` +
                      `📝 <b>Примечания:</b> ${notes || 'Нет'}`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'HTML'
          })
        });

        const resData = await response.json();

        if (resData.ok) {
          if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
          }
          if (tg && tg.close) {
            tg.close();
          } else {
            alert('Отчёт успешно отправлен!');
            submitBtn.disabled = false;
            submitBtn.innerText = "Отправить отчёт";
          }
        } else {
          alert('Ошибка при отправке: ' + resData.description);
          submitBtn.disabled = false;
          submitBtn.innerText = "Отправить отчёт";
        }
      } catch (err) {
        alert('Сетевая ошибка при отправке отчёта.');
        submitBtn.disabled = false;
        submitBtn.innerText = "Отправить отчёт";
      }
    });
  </script>
</body>
</html>
